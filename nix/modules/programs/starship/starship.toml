"$schema" = "https://starship.rs/config-schema.json"

# ── Active palette ────────────────────────────────────────────────────────────
palette = "one_dark"

# ── Global ────────────────────────────────────────────────────────────────────
add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$direnv\
$fill\
$battery\
$status\
$line_break\
$character"""

right_format = """
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$kubernetes\
$memory_usage\
$cmd_duration\
$time"""

continuation_prompt = '▶▶ '

# ── Hostname (SSH sessions only) ─────────────────────────────────────────────
[hostname]
ssh_only = true
style    = "bold green"
format   = "[ 󰒋 $hostname]($style) in "
trim_at  = "."

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
style             = "bold blue"
read_only         = " 󰌾"
read_only_style   = "red"
truncate_to_repo  = true
truncation_length = 3
home_symbol       = "~ "
format            = "[ $path]($style)[$read_only]($read_only_style) "

# ── Git Branch ────────────────────────────────────────────────────────────────
[git_branch]
symbol            = ' '
style             = "bold purple"
format            = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 20
truncation_symbol = "…"

# ── Git Commit (shown on detached HEAD) ───────────────────────────────────────
[git_commit]
disabled           = false
commit_hash_length = 7
style              = "bold green"
format             = '[ $hash( 🏷 $tag)]($style) '
tag_disabled       = false
tag_symbol         = "🏷 "
only_detached      = true

# ── Git State (rebase / merge / cherry-pick / bisect in progress) ─────────────
[git_state]
disabled     = false
style        = "bold yellow"
format       = '[\($state( $progress_current/$progress_total)\)]($style) '
rebase       = "REBASE"
merge        = "MERGE"
revert       = "REVERT"
cherry_pick  = "🍒 PICK"
bisect       = "BISECT"
am           = "AM"
am_or_rebase = "AM/REBASE"

# ── Git Metrics (+added / -deleted lines) ────────────────────────────────────
# disabled=true by default in starship — explicitly enabled here
[git_metrics]
disabled           = false
added_style        = "bold green"
deleted_style      = "bold red"
format             = '[+$added]($added_style) [-$deleted]($deleted_style) '
only_nonzero_diffs = true

# ── Git Status ────────────────────────────────────────────────────────────────
[git_status]
style      = "yellow"
format     = '([$all_status$ahead_behind]($style) )'
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
staged     = "[+${count}](green)"
modified   = "[~${count}](yellow)"
untracked  = "[?${count}](bright-black)"
deleted    = "[-${count}](red)"
conflicted = "[!${count}](red)"
stashed    = "[≡${count}](bright-black)"

# ── Direnv ────────────────────────────────────────────────────────────────────
# disabled=true by default in starship — explicitly enabled here
# Shows: loaded/allowed status of the nearest .envrc
[direnv]
disabled        = false
style           = "bold yellow"
format          = '[$symbol$loaded/$allowed]($style) '
symbol          = "󰈲 "
allowed_msg     = "✔"
not_allowed_msg = "✘"
denied_msg      = "✘"
loaded_msg      = "✔"
unloaded_msg    = "✘"

# ── Battery (show ONLY when discharging < 20%) ───────────────────────────────
# Nerd Font glyphs from nf-md-battery-* family (confirmed in Symbols Nerd Font)
[battery]
full_symbol        = "󰁹 "
charging_symbol    = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol     = "󰂑 "
empty_symbol       = "󰂎 "
format             = "[$symbol$percentage]($style) "

[[battery.display]]
threshold          = 20
style              = "bold red"

# ── Status (exit code) ───────────────────────────────────────────────────────
[status]
disabled       = false
style          = "red"
format         = "[$symbol$status]($style) "
symbol         = "✗ "
success_symbol = ""

# ── Fill ──────────────────────────────────────────────────────────────────────
[fill]
symbol = " "

# ── Character ─────────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold purple)"

# ── Python ────────────────────────────────────────────────────────────────────
[python]
symbol         = "  "
style          = "yellow"
format         = '[$symbol$version( \($virtualenv\))]($style) '
detect_files   = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "Pipfile"]
detect_folders = [".venv", "venv", "__pycache__"]
version_format = "v${major}.${minor}"
python_binary  = ["python3", "python"]

# ── Node ──────────────────────────────────────────────────────────────────────
[nodejs]
symbol            = " "
style             = "green"
format            = "[$symbol$version]($style) "
detect_files      = ["package.json", ".nvmrc", ".node-version"]
version_format    = "v${major}"
not_capable_style = "red"

# ── Rust ──────────────────────────────────────────────────────────────────────
[rust]
symbol         = " "
style          = "red"
format         = "[$symbol$version]($style) "
detect_files   = ["Cargo.toml"]
version_format = "v${major}.${minor}"

# ── Go ────────────────────────────────────────────────────────────────────────
[golang]
symbol         = " "
style          = "cyan"
format         = "[$symbol$version]($style) "
detect_files   = ["go.mod", "go.sum"]
version_format = "v${major}.${minor}"

# ── Docker ────────────────────────────────────────────────────────────────────
[docker_context]
symbol          = " "
style           = "blue"
format          = "[$symbol$context]($style) "
only_with_files = true
detect_files    = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ── Kubernetes ────────────────────────────────────────────────────────────────
[kubernetes]
symbol       = "󱃾 "
style        = "blue"
format       = '[$symbol$context( \[$namespace\])]($style) '
disabled     = false
detect_files = ["*.yaml", "*.yml"]

# ── Memory ────────────────────────────────────────────────────────────────────
[memory_usage]
disabled  = false
threshold = 75
symbol    = "󰘚 "
style     = "bright-black"
format    = "[$symbol${ram}]($style) "

# ── Duration ──────────────────────────────────────────────────────────────────
[cmd_duration]
disabled           = false
min_time           = 2000
format             = "[ $duration]($style) "
style              = "yellow"
show_milliseconds  = false
show_notifications = false

# ── Time ──────────────────────────────────────────────────────────────────────
[time]
disabled    = false
time_format = "%H:%M"
style       = "bright-black"
format      = "[ $time]($style)"

# ── Disabled modules ──────────────────────────────────────────────────────────
[gcloud]
disabled = true
[aws]
disabled = true
[azure]
disabled = true
[terraform]
disabled = true
[pulumi]
disabled = true
[helm]
disabled = true
[java]
disabled = true
[scala]
disabled = true
[php]
disabled = true
[ruby]
disabled = true

# ── One Dark palette (MUST be last — dotted subtable must end the file) ───────
[palettes.one_dark]
black        = "#282c34"
red          = "#e06c75"
green        = "#98c379"
yellow       = "#e5c07b"
blue         = "#61afef"
purple       = "#c678dd"
cyan         = "#56b6c2"
white        = "#abb2bf"
bright-black = "#5c6370"
