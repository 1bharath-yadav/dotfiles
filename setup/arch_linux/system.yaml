schema: dotfiles-system/v1
name: archer-arch
purpose: Concise Arch Linux system manifest for AI agents and shell automation.

host:
  os: Arch Linux
  desktop: Hyprland
  shell: zsh
  editor: neovim

repo:
  root: /home/archer/.dotfiles
  update: ./update.sh
  setup: ./setup/main.sh arch
  bootstrap: ./setup/bootstrap.sh arch

ownership:
  system_packages: pacman
  user_packages: nix-home-manager
  android_user_packages: nix-on-droid

rules:
  - Prefer shell entrypoints only for local automation.
  - Put reusable scripts in nix/modules/programs/bin/scripts/.
  - Use nix/modules/programs/bin/scripts/dev.sh for environment diagnostics.
  - Use ./update.sh after repo changes.

entrypoints:
  dev_env_snapshot: ./nix/modules/programs/bin/scripts/dev.sh
  refresh_apps: ./nix/modules/programs/bin/scripts/refresh-apps
  check_drift: ./nix/modules/programs/bin/scripts/check-drift
  update_agent_skills: ./nix/modules/programs/bin/scripts/update-agent-skills
  system_clean: ./nix/modules/programs/bin/scripts/system-clean.sh

references:
  flake: ./flake.nix
  arch_packages: ./setup/arch_linux/pacman-explicit.txt
  setup_guide: ./Setup.md
