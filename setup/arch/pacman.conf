#
# /etc/pacman.conf
# Optimized for speed + beautiful output
#

[options]

# XferCommand = /usr/bin/aria2c --allow-overwrite=true --file-allocation=none --max-connection-per-server=16 --split=16 --min-split-size=1M --continue=true --dir=/var/cache/pacman/pkg --out=%o %u
# -------------------------------------------------
# Core
# -------------------------------------------------
Architecture = auto
CheckSpace
Color
ILoveCandy
VerbosePkgLists

# -------------------------------------------------
# Performance
# -------------------------------------------------
ParallelDownloads = 10
DownloadUser = alpm


# -------------------------------------------------
# Package Protection
# -------------------------------------------------

# Ignore packages you manage manually
# IgnorePkg = 

# -------------------------------------------------
# Security
# -------------------------------------------------
SigLevel = Required DatabaseNever
LocalFileSigLevel = Optional

# -------------------------------------------------
# Paths (defaults)
# -------------------------------------------------
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/

# =================================================
# REPOSITORIES
# =================================================

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# [multilib]
# Include = /etc/pacman.d/mirrorlist
#
# =================================================
# THIRD PARTY
# =================================================

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist


# =================================================
# OPTIONAL (DISABLED)
# =================================================

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

