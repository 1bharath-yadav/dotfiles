schema: dotfiles-system/v2
name: archer-arch
purpose: Arch Linux package ownership and command manifest.

host:
  os: Arch Linux
  desktop: Hyprland
  shell: zsh
  editor: neovim

repo:
  root: /home/archer/.dotfiles
  bootstrap: ./setup/bootstrap.sh arch
  individual_apply: ./setup/main.sh apply <pacman|home|system|external|all> arch
  overall_update: ./update.sh

ownership:
  pacman_native:
    - ./setup/arch/packages/native-core.txt
    - ./setup/arch/packages/native-desktop.txt
    - ./setup/arch/packages/native-services.txt
  pacman_aur:
    - ./setup/arch/packages/aur.txt
  system_nix: ./nix/system/arch-system.nix
  home_manager:
    - ./nix/modules/packages/common.nix
    - ./nix/modules/packages/arch-home.nix
  external: ./nix/modules/packages/external.txt

entrypoints:
  dots_apply: ./setup/main.sh apply
  dots_update: ./update.sh
  sync_external_tools: ./nix/modules/programs/bin/scripts/sync-external-tools
  check_drift: ./nix/modules/programs/bin/scripts/check-drift
  system_apply: ./nix/system/apply.sh
  system_diff: ./nix/system/diff.sh