set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix
unbind %

bind | split-window -h
set -g status-position top
unbind '"'
bind - split-window -v
unbind r

set -g set-clipboard on          # use system clipboard
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux config"

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g history-limit 20000       # keep more scrollback for long sessions
set -g display-time 4000         # show messages a bit longer
set -g status-interval 5         # refresh status more smoothly
set -g renumber-windows on       # keep window indices compact
set -g set-titles on             # show helpful window titles
set -g focus-events on           # better integration with terminal apps
set -g escape-time 10            # faster key sequences
set -g repeat-time 600           # allow repeated key bindings without delay

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'


set -g @floax-width '80%'
set -g @floax-height '80%'


set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/home/archer/.dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/.dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality






set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'



# Yazi needs
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)


run '~/.tmux/plugins/tpm/tpm'

# Apply the currently active Omarchy palette; refreshed by the theme-set hook.
run-shell -b 'bash "$HOME/.config/tmux/omarchy-theme.sh"'
