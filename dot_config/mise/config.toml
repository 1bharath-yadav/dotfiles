[tools]
node = "latest"
pnpm = "latest"
rust = "stable"

# Python CLI tooling via mise's pipx backend.
"pipx:ruff" = "latest"
"pipx:black" = "latest"
"pipx:pylint" = "latest"
"pipx:isort" = "latest"
"pipx:mypy" = "latest"
"pipx:yamllint" = "latest"
"pipx:sqlfluff" = "latest"

# JavaScript / documentation CLIs.
"npm:prettier" = "latest"
"npm:eslint_d" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:sql-formatter" = "latest"
"npm:agent-desktop" = "latest"
# Existing development / AI tools.
"npm:@openai/codex" = "latest"
# "npm:@google/gemini-cli" = "latest"
"npm:screenpipe" = "latest"

"npm:@wonderwhy-er/desktop-commander" = { version = "latest", trust_policy_excludes = ["chromium-bidi@157.0.8090-0"] }

# AXI (Agent eXperience Interface) tooling - https://axi.md
# Replaced normal CLIs with token-efficient, agent-ergonomic AXI packages:
#   - agent-browser        -> chrome-devtools-axi (browser automation)
#   - @googleworkspace/cli -> gws-axi (unified Google Workspace CLI)
#   - gh                   -> gh-axi (GitHub CLI wrapper)
#   - azure-cli            -> az-axi (Azure CLI wrapper)
"npm:chrome-devtools-axi" = "latest"
"npm:gws-axi" = { version = "latest", allow_low_downloads = true }
"npm:gh-axi" = "latest"
"npm:az-axi" = { version = "latest", allow_low_downloads = true }
"npm:quota-axi" = "latest"
"npm:lavish-axi" = "latest"
"npm:tasks-axi" = "latest"

"copilot-cli" = "latest"
"agy" = "latest"
"vercel" = "latest"
"azure-cli" = "latest" # Backing CLI engine required by az-axi
"claude" = "latest"
# "github:mudler/LocalAI" = "latest"
"github:openai/tunnel-client" = "latest"
"github:jtroo/kanata" = "latest"
# "github:iOfficeAI/OfficeCLI" = "latest"
#
"github:surrealdb/surrealdb" = "latest"
"github:gradium-ai/xn-ptts[matching=ptts-0.5.0-x86_64-unknown-linux-gnu.tar.gz,rename_exe=ptts]" = "0.5.0"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
codex = "latest"
pi = "latest"

[tasks.db]
description = "Start local SurrealDB memory instance for AI Agent"
run = "surreal start --user root --pass secret memory"

[settings]
experimental = true
jobs = 4
legacy_version_file = true
idiomatic_version_file_enable_tools = ["node", "python", "rust", "pnpm"]

minimum_release_age = "0s" 

[settings.cargo]
binstall = true

