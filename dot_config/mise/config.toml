[tools]
node = "latest"
pnpm = "latest"
rust = "stable"

# Python CLI tooling via mise's pipx backend.
"pipx:ruff" = "latest"
"pipx:black" = "latest"
"pipx:pylint" = "latest"
"pipx:isort" = "latest"
"pipx:mypy" = "latest"
"pipx:yamllint" = "latest"
"pipx:sqlfluff" = "latest"

# JavaScript / documentation CLIs.
"npm:prettier" = "latest"
"npm:eslint_d" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:sql-formatter" = "latest"
"npm:agent-browser" = "latest"
# Existing development / AI tools.
"npm:@openai/codex" = "latest"
# "npm:@google/gemini-cli" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:screenpipe" = "latest"

"npm:@wonderwhy-er/desktop-commander" = { version = "latest", trust_policy_excludes = ["chromium-bidi@157.0.8090-0"] }


"copilot-cli" = "latest"
"agy" = "latest"
"gh" = "latest"
"vercel" = "latest"
"azure-cli" = "latest"
"claude" = "latest"
# "github:mudler/LocalAI" = "latest"
"github:openai/tunnel-client" = "latest"
"github:jtroo/kanata" = "latest"
# "github:iOfficeAI/OfficeCLI" = "latest"
#
"github:surrealdb/surrealdb" = "latest"

[tasks.db]
description = "Start local SurrealDB memory instance for AI Agent"
run = "surreal start --user root --pass secret memory"

[settings]
experimental = true
jobs = 4
legacy_version_file = true
idiomatic_version_file_enable_tools = ["node", "python", "rust", "pnpm"]

minimum_release_age = "0s" 

[settings.cargo]
binstall = true

