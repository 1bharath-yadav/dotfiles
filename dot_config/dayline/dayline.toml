# Dayline User Configuration
# ~/.config/dayline/dayline.toml

[dayline]
data_dir = "~/.local/share/dayline"
timezone = "Asia/Kolkata"
day_boundary = "00:00"
log_level = "info"
lock_timeout_secs = 10

# ─────────────────────────────────────────────────────────────
# Sources Configuration
# ─────────────────────────────────────────────────────────────

[sources.git_local]
enabled = true
discovery_roots = ["~/projects"]
# Exclude specific repos (exact names or glob patterns)
exclude_repos = [
    "AltaCV",
    "1bharath-yadav.github.io"
]
track_commits = true
track_working_tree = true
max_diff_lines = 150

[sources.screenpipe]
enabled = true
api_url = "http://localhost:3030"
extract_frames = true
extract_ui_events = true
page_size = 100
# Exclude sensitive or unwanted applications / windows
exclude_apps = [
    "1password",
    "bitwarden",
    "keepassxc"
]
exclude_windows = []

[sources.github_remote]
enabled = true
# Token is auto-discovered via GITHUB_TOKEN or `gh auth token`
exclude_repos = [
    "AltaCV",
    "1bharath-yadav.github.io"
]
include_forks = false
track_commits = true
track_pull_requests = true
track_issues = true
track_releases = true
max_repos_to_scan = 50

[sources.plan_input]
enabled = true
patterns = [
    "~/til/{year}/{month}/plans/{date}_day_plan.md",
    "~/til/{year}/{month}/plans/{date}-day-plan.md",
    "~/til/{year}/{month}/week{week}_plan.md",
    "~/til/{year}/{month}/week_{week}_plan.md",
    "~/til/{year}/month_{month}_plan.md",
    "~/til/tasks.json",
    "~/til/daily-tasks.md"
]

[sources.gws]
enabled = true
services = ["calendar", "tasks"]
include_tomorrow = true

[sources.immich]
enabled = false
api_url = "http://localhost:2283"
api_key = "${IMMICH_API_KEY:}"
timezone = "Asia/Kolkata"
page_size = 100
filter_field = "taken_at"
include_archived = false
include_favorites_only = false

# ─────────────────────────────────────────────────────────────
# Sinks Configuration
# ─────────────────────────────────────────────────────────────

[sinks.jsonl_archive]
enabled = true

[sinks.duckdb_store]
enabled = true
path = "~/.local/share/dayline/store.duckdb"

[sinks.markdown_report]
enabled = true
output_dir = "~/.local/share/dayline/reports/daily"

[sinks.next_day_plan]
enabled = true
output_pattern = "~/til/{year}/{month}/plans/{date}_day_plan.md"
week_pattern = "~/til/{year}/{month}/week{week}_plan.md"
month_pattern = "~/til/{year}/month_{month}_plan.md"
json_pattern = "~/til/tasks.json"
formats = ["markdown", "json"]
plan_types = ["day", "week", "month"]
exclude_repos = [
    "AltaCV",
    "1bharath-yadav.github.io"
]

[sinks.codecast]
enabled = true
output_dir = "~/projects/1bharath-yadav/week/data"
allowed_repos = [
    "dotfiles",
    "1bharath-yadav/dotfiles",
    "focaltech-fte4800-linux-driver",
    "dayline",
    "hard-tools",
    "garnet-firmware-update",
    "sensvault"
]

[sinks.immich_store]
enabled = false
api_url = "http://localhost:2283"
api_key = "${IMMICH_API_KEY:}"
album_name = "Dayline - {date}"
create_album = true
device_id = "dayline"

# ─────────────────────────────────────────────────────────────
# Routing Configuration
# ─────────────────────────────────────────────────────────────

[routing]
git_local = ["jsonl_archive", "duckdb_store", "markdown_report", "codecast", "next_day_plan"]
screenpipe = ["jsonl_archive", "duckdb_store", "markdown_report", "immich_store"]
github_remote = ["jsonl_archive", "duckdb_store", "markdown_report", "codecast"]
plan_input = ["jsonl_archive", "duckdb_store", "next_day_plan"]
gws = ["jsonl_archive", "duckdb_store", "next_day_plan"]
immich = ["jsonl_archive", "duckdb_store", "markdown_report"]
