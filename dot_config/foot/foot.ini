# Colors come from the active Omarchy theme (regenerated on every `omarchy theme set`).
# The generated file only defines [colors-dark], including for light themes, so pin
# the color theme to dark; otherwise light themes fall back to foot's built-in palette.
include=~/.local/state/omarchy/current/theme/foot.ini
initial-color-theme=dark

shell=zsh
term=xterm-256color

title=foot

font=JetBrainsMono Nerd Font:size=14
letter-spacing=0
dpi-aware=no

pad=25x25

bold-text-in-bright=no

[scrollback]
lines=10000

# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c

