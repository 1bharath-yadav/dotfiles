# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above


# Meta / edit configs
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Hardware
bind = Alt,bracketleft, exec, brightnessctl set 1%-
bind = Alt,bracketright, exec, brightnessctl set +1%

# Session / toggles
bind = SUPER+ALT, F4, exec,quickshell -c ii ipc call session toggle
bind = SUPER+ALT, N ,exec, ~/.config/hypr/custom/scripts/logseq.sh
bind = SUPER+ALT,G, exec, ~/.config/hypr/custom/scripts/toggle-gdrive.sh
bind = SUPER+ALT,B, exec, ~/.config/hypr/custom/scripts/toggle-syncthing.sh
bind = SUPER+ALT,I,exec, ~/.config/hypr/custom/scripts/send_file.sh

# Screenshots
bindld = SUPER+ALT,P, Screenshot >> clipboard ,exec,grim - | wl-copy # Screenshot >> clipboard
bindld = Ctrl+ALT,P, Screenshot >> clipboard & save, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screenshot >> clipboard & file

# Apps
#bind = SUPER,J, exec, fuzzel 
bind = SUPER+ALT,E, exec, zen-browser
bind = SUPER+ALT,K, exec,koodo-reader
bind = SUPER, O, togglespecialworkspace, obsidian
workspace = special:obsidian, on-created-empty:[float; center; size (monitor_w*0.9) (monitor_h*0.9)] obsidian

bind = SUPER, Y, togglespecialworkspace, yazi
workspace = special:yazi, on-created-empty:[float; center; size (monitor_w*0.9) (monitor_h*0.9)] kitty --class yazi-sp -e yazi


bind = SUPER, z, togglespecialworkspace, kitty
workspace = special:kitty, on-created-empty:[float; center; size (monitor_w*0.8) (monitor_h*0.8)] kitty  


bind = SUPER, minus, togglespecialworkspace, quicknote
workspace = special:quicknote, on-created-empty:[float; center; size (monitor_w*0.6) (monitor_h*0.6)] \
kitty --class quicknote -e yazi "/home/archer/Sync/obsidian_vault/til/"

bind = SUPER+Ctrl, G, togglespecialworkspace, calendar
workspace = special:calendar, on-created-empty:[float; center; size (monitor_w*0.65) (monitor_h*0.85)] google-chrome-stable --class=gcal --app=https://calendar.google.com



bind = SUPER, right, workspace, +1 # Move to right workspace
bind = SUPER, left, workspace, -1 # Move to left workspace

# Voice Assistant — toggle assistant window on Super+Alt+H
bind = SUPER+ALT, H, exec, quickshell -c ii ipc call voiceAssistant toggle # Voice: toggle assistant

# Dictation — hold to record, release to transcribe/paste on Super+H
bindl = SUPER, H, exec, ~/.local/bin/whisper-hold start # Dictation: start recording
bindr = SUPER, H, exec, ~/.local/bin/whisper-hold stop # Dictation: stop and paste
