# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# ── Environment propagation ───────────────────────────────────────────────────
# Launcher-started apps can come from the D-Bus/systemd activation environment,
# not from an interactive shell. Export the full Hyprland session env so apps
# launched from Quickshell/fuzzel see the same config/runtime environment as
# apps started from a terminal.
exec-once = systemctl --user import-environment --all
exec-once = dbus-update-activation-environment --systemd --all

# exec-once=~/.local/bin/ai_commits.sh
