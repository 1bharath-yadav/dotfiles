# Google Chrome flags managed by chezmoi.
# Keep --enable-features as ONE comma-separated switch.
#
# Book Vault / Gemini Glic agent stack:
#   Chrome Glic -> Actor -> WebMCP page tools -> localhost /api/ops -> book HTML.
#
# Required:
#   Glic
#   GlicActor
#   GlicActorEnableScriptTools
#   WebMCP
#   GlicExperimentalTriggering
#   GlicExperimentalTriggeringScriptTools
#   GlicExperimentalTriggeringOptInBypass
#   BrowserActuator
#   EnableBrowserActuatorForGlicExperimentalTriggering
#
# Safety: do NOT enable GlicDisableActorSafetyChecks.

# Native Wayland
--ozone-platform-hint=wayland
--ozone-platform=wayland

# GTK4 integration
--gtk-version=4

# Wayland IME support
--enable-wayland-ime

# GNOME Keyring
--password-store=gnome-libsecret

# Ignore Chrome GPU blacklist
--ignore-gpu-blocklist

# Lower copy overhead
--enable-zero-copy

# Broad experimental web-platform features are not needed; WebMCP is enabled
# explicitly in the feature switch below.
# --enable-experimental-web-platform-features

# REQUIRED + useful Glic UI integration
--enable-features=ParallelDownloading,TouchpadOverscrollHistoryNavigation,TabGroupsSave,StrictOriginIsolation,Glic,GlicActor,GlicActorEnableScriptTools,BrowserActuator,GlicSelectionPrompt,GlicLauncher,GlicPinnedEntryPoint,GlicSettingsPage

# Force Gemini rollout
# --force-fieldtrials=Glic/Enabled/

# Omarchy extensions
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim

# --- NOT REQUIRED FOR THE BOOK WEBMCP PATH ---
# GlicPdfSummarize
# GlicTabGroups
# GlicContextualCueing
# GlicZeroStateSuggestions
# GlicHotkeyLocalScope
# GlicBackgroundActuation
# GlicBackgroundTriggering
# GlicExperimentalTriggeringOptInTabFocus
# GlicExperimentalTriggeringScreenshot
# GlicExperimentalTriggeringOsNotification
# GlicActorTransientTasks
# GlicActorAutofill
# GlicActorAutofillSectionLabel
# GlicActorAutofillPreClick
# GlicDaisyChainNewTabs
# GlicDefaultToLastActiveConversation
# GlicActorSkipScreenshot
# GlicActorSkipPageContent

# Localhost sensitivity would be counterproductive for our localhost book server.
# --enable-features=GlicActorLocalhostIsSensitive

# NEVER enable this separate safety bypass.
# --enable-features=GlicDisableActorSafetyChecks

# Optional GPU experiments -- unrelated to Glic/WebMCP.
# --enable-gpu-rasterization
# --use-angle=vulkan
# --enable-features=Vulkan
# --enable-unsafe-webgpu
# --enable-webgpu-developer-features
# --enable-force-dark
