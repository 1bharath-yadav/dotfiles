# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# ── Environment propagation ───────────────────────────────────────────────────
# Hyprland processes `env =` directives (including XDG_DATA_DIRS with nix-profile)
# AFTER systemd user units start. Push the final env into systemd and D-Bus so
# that app launchers (fuzzel, Quickshell), portals, and systemd user services
# all see Nix-installed .desktop files.
exec-once = systemctl --user import-environment XDG_DATA_DIRS PATH XCURSOR_PATH NIX_PATH
exec-once = dbus-update-activation-environment --systemd XDG_DATA_DIRS PATH XCURSOR_PATH NIX_PATH DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once=~/bin/ai_commits.sh
