# custom/env.conf — archer's additions on top of hyprland/env.conf
# Sourced after hyprland/env.conf in hyprland.conf

# ── Nix visibility ────────────────────────────────────────────────────────
# Without these, Quickshell/fuzzel cannot see Nix-installed apps at session
# start because XDG_DATA_DIRS and PATH are set by the shell, not the session.
#
# Hyprland inherits only the PAM/systemd environment, which doesn't include
# ~/.nix-profile paths unless explicitly added here.

# Extend XDG_DATA_DIRS so .desktop files from Nix packages are found.
# Appends after the existing Flatpak/usr paths set by hyprland/env.conf.
env = XDG_DATA_DIRS,$HOME/.nix-profile/share:$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# Add Nix profile bin to PATH so Hyprland exec-once commands find Nix tools.
env = PATH,$HOME/.nix-profile/bin:$PATH

# Nix requires this to find the default profile when no daemon is running.
env = NIX_PATH,nixpkgs=flake:nixpkgs

# ── Editor ────────────────────────────────────────────────────────────────
env = EDITOR,nvim

# ── Input method (uncomment if using fcitx5) ─────────────────────────────
#env = QT_IM_MODULE, fcitx
#env = XMODIFIERS, @im=fcitx
